# Separate paid deployment. Does not rename or upgrade the free test resources.
# Redis remains on the free plan: a workspace with an existing free Redis cannot
# create another. Resolve that limit before deploying; do not silently add costs.
services:
  - type: web
    name: pointage360-paid
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./docker/render-free.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    disk:
      name: pointage360-files-paid
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: PASSWORD_POLICY_STRICT
        value: "true"
      - key: SEED_DEMO_ON_START
        value: "false"
      # Creates the initial Futura HR account only if the database is empty.
      - key: BOOTSTRAP_DEMO_ON_START
        value: "true"
      - key: DEMO_PASSWORD
        # Public initial password only. Change the account password after login.
        value: "PointageDemo2026!"
      - key: WEB_ORIGIN
        value: https://pointage360-paid.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pointage360-db-paid
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pointage360-redis-paid
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: AUTH_CONTEXT_CACHE_ENABLED
        value: "true"
      - key: AUTH_CONTEXT_CACHE_TTL_SECONDS
        value: "30"
      - key: MINIO_ENDPOINT
        value: 127.0.0.1
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_ACCESS_KEY
        generateValue: true
      - key: MINIO_SECRET_KEY
        generateValue: true
      - key: MINIO_BUCKET
        value: pointage360
      - key: MINIO_DATA_DIR
        value: /var/data/minio
      - key: STORAGE_PROXY_DOWNLOADS
        value: "true"

  - type: keyvalue
    name: pointage360-redis-paid
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: pointage360-db-paid
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: pointage360
    user: pointage360
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
